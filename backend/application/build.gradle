// Use cases and ports around the engine (ADR-0002). Plain Java: no Spring here either.
apply plugin: 'java-library'

dependencies {
    api project(':backend:engine')
}

dependencies {
    testImplementation 'net.jqwik:jqwik:1.10.2'
}

// Mutation testing (LE-018): `./gradlew :backend:application:pitest`; threshold in backend/quality-gates/mutation-application/.
rootProject.ext.applyMutationGate(project, 'mutation-application', ['application.*'])
