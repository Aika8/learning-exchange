spring.application.name=learning-exchange
server.port=8080
# Event journal (ADR-0005): JSON lines, replayed on start. "memory" keeps it in memory only.
exchange.journal=data/journal.jsonl
exchange.bots-file=bots.yaml
exchange.bots-enabled=true
# What a new dev account receives (minor units): 100 000.00 SPARK and 1 000 SILK.
exchange.starting-balance.SPARK=10000000
exchange.starting-balance.SILK=1000
# The exchange's bank (minor units / units), journalled once: lends to leveraged positions, pays deposit interest.
exchange.bank-capital.SPARK=100000000000
exchange.bank-capital.AMBER=10000000
# Savings deposit: 14% a year, compounded daily. One bank day = 60 s of simulation time (at ×60 a day passes every
# real second, so a year takes about 6 minutes and the rule of 72 can be watched).
exchange.savings.rate-bps=1400
exchange.savings.day-millis=60000
# M2b: the economy's seed (reports, rate decisions, storms), and the catalogue/glossary served by the BFFs (ADR-0012).
exchange.economy-seed=42
exchange.catalogue-file=docs/lore/catalogue.yaml
exchange.glossary-file=docs/lore/glossary.yaml
