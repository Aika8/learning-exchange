// Framework-free, deterministic matching engine: no dependencies besides the JDK.
dependencies {
    testImplementation 'net.jqwik:jqwik:1.10.2'
}

// Mutation testing (LE-017): `./gradlew :backend:engine:pitest`; threshold in backend/quality-gates/mutation-engine/.
rootProject.ext.applyMutationGate(project, 'mutation-engine', ['engine.*'])
