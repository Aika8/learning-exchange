<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Настройки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F6F8;color:#14202B;font-family:'Golos Text',sans-serif;padding:20px 16px;display:flex;flex-direction:column;gap:12px">
  <div style="font-size:22px;font-weight:600">Настройки</div>
  <div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
    <div style="font-size:15px;font-weight:600">Язык / Language</div>
    <div style="display:flex;background:#EAEEF2;border-radius:12px;padding:4px"><button onClick="{{ru}}" style="flex:1;height:40px;border:0;border-radius:8px;background:{{ruBg}};font:600 14px 'Golos Text';color:#14202B">Русский</button><button onClick="{{en}}" style="flex:1;height:40px;border:0;border-radius:8px;background:{{enBg}};font:600 14px 'Golos Text';color:#14202B">English</button></div>
  </div>
  <div style="background:#FFFFFF;border-radius:16px;padding:4px 14px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5"><div style="display:flex;justify-content:space-between;align-items:center;min-height:52px;border-bottom:1px solid #D3DAE1;font-size:15px"><span>{{r.k}}</span><span style="color:#526170">{{r.v}}</span></div></sc-for>
  </div>
  <div style="font-size:12px;color:#526170">Ветрило — учебное приложение. Все деньги учебные.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const en=this.state&&this.state.en;
return { ru:()=>this.setState({en:false}), en:()=>this.setState({en:true}),
ruBg: en?'transparent':'#FFFFFF', enBg: en?'#FFFFFF':'transparent',
rows:[{k:'Тема',v:'Как в системе'},{k:'Риск на сделку',v:'1% капитала'},{k:'Профиль разработчика',v:'Новичок'},{k:'Уведомления',v:'Вкл.'},{k:'Сбросить учебный счёт',v:'›'}] };
}
}
</script>
</body>
</html>
