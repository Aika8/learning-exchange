<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Облигация</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F6F8;color:#14202B;font-family:'Golos Text',sans-serif;padding:20px 16px;display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:22px;font-weight:600">Облигация ЭМТ-28</div><span style="padding:4px 10px;border-radius:8px;border:1px solid #1D5C7A;color:#1D5C7A;font-weight:600;font-size:13px">BBB</span></div>
  <div style="font-size:13px;color:#526170">Эмитент: учебная компания «ЭнергоМост»</div>
  <div style="background:#1D5C7A;color:#FFFFFF;border-radius:20px;padding:16px">
    <div style="font-size:13px">Доходность к погашению</div>
    <div class="num" style="font-size:34px;font-weight:700">15,8%</div>
  </div>
  <div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
    <sc-for list="{{l}}" as="r" hint-placeholder-count="4"><div class="num" style="display:flex;justify-content:space-between;font-size:14px"><span>{{r.k}}</span><span>{{r.v}}</span></div></sc-for>
    <div style="font-size:12px;color:#526170">Дюрация 3,2: если ставки вырастут на 1 п.п., цена упадёт примерно на 3,2%.</div>
  </div>
  <div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:15px;font-weight:600">График купонов</div>
    <sc-for list="{{c}}" as="r" hint-placeholder-count="4"><div class="num" style="display:flex;justify-content:space-between;font-size:14px"><span>{{r.d}}</span><span>{{r.v}}</span></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { l:[{k:'Купон',v:'14% годовых, 2 раза в год'},{k:'Погашение',v:'15.03.2030'},{k:'Цена',v:'96,40% номинала'},{k:'Дюрация',v:'3,2 года'}],
c:[{d:'15.03.2027',v:'70 UKZT'},{d:'15.09.2027',v:'70 UKZT'},{d:'15.03.2028',v:'70 UKZT'},{d:'…',v:''}] };
}
}
</script>
</body>
</html>
