<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Календарь событий</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F6F8;color:#14202B;font-family:'Golos Text',sans-serif;padding:20px 16px;display:flex;flex-direction:column;gap:10px">
  <div style="font-size:22px;font-weight:600">Календарь событий</div>
  <label style="display:flex;align-items:center;gap:8px;min-height:44px;font-size:15px"><input type="checkbox" checked style="width:20px;height:20px">Только по моим бумагам</label>
  <div style="border:1px solid #8F5A00;color:#8F5A00;border-radius:12px;padding:10px 12px;font-size:13px">⚠ У вас 2 позиции со стопом перед решением по ставке.</div>
  <sc-for list="{{days}}" as="d" hint-placeholder-count="2">
    <div style="font-size:13px;font-weight:600;color:#526170;margin-top:4px">{{d.day}}</div>
    <sc-for list="{{d.ev}}" as="e" hint-placeholder-count="2">
      <div style="background:#FFFFFF;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;justify-content:space-between;font-size:15px"><span>{{e.t}}</span><span style="font-size:12px;color:#526170">{{e.imp}}</span></div>
        <div class="num" style="font-size:12px;color:#526170">{{e.d}}</div>
      </div>
    </sc-for>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { days:[
{day:'Вторник, 17 ноября',ev:[{t:'Решение по базовой ставке',imp:'●●● высокая',d:'Сейчас 16,5% · консенсус 16,5% · итог —'},{t:'Отчёт TKR',imp:'●● средняя',d:'После закрытия торгов'}]},
{day:'Четверг, 19 ноября',ev:[{t:'Инфляция за октябрь',imp:'●●● высокая',d:'Прошлое 8,9% · консенсус 8,7%'},{t:'Отсечка дивидендов ABC',imp:'● низкая',d:'Дивиденд 42 UKZT на акцию'}]}
]};
}
}
</script>
</body>
</html>
