<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Вклад</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:390px;height:{{h}};box-sizing:border-box;background:#F4F6F8;color:#14202B;font-family:'Golos Text',sans-serif;padding:20px 16px;display:flex;flex-direction:column;gap:12px">
  <div style="font-size:22px;font-weight:600">{{title}}</div>
  <sc-if value="{{sub}}" hint-placeholder-val="{{ true }}"><div style="font-size:13px;color:#526170">{{sub}}</div></sc-if>
  <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
    <div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
      <sc-if value="{{c.h}}" hint-placeholder-val="{{ true }}"><div style="font-size:15px;font-weight:600">{{c.h}}</div></sc-if>
      <sc-if value="{{c.pts}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 330 70" style="width:100%;height:70px" role="img" aria-label="{{c.h}}"><polyline points="{{c.pts}}" fill="none" stroke="#1D5C7A" stroke-width="2"></polyline><sc-if value="{{c.pts2}}" hint-placeholder-val="{{ false }}"><polyline points="{{c.pts2}}" fill="none" stroke="#B8621B" stroke-width="2" stroke-dasharray="5 4"></polyline></sc-if></svg></sc-if>
      <sc-for list="{{c.l}}" as="r" hint-placeholder-count="3">
        <div class="num" style="display:flex;justify-content:space-between;gap:12px;font-size:14px;color:{{r.c}}"><span>{{r.k}}</span><span style="text-align:right">{{r.v}}</span></div>
      </sc-for>
      <sc-if value="{{c.n}}" hint-placeholder-val="{{ false }}"><div style="font-size:12px;color:#526170">{{c.n}}</div></sc-if>
    </div>
  </sc-for>
  <sc-for list="{{alerts}}" as="a" hint-placeholder-count="1">
    <div style="border:1px solid {{a.c}};color:{{a.c}};border-radius:12px;padding:10px 12px;font-size:13px">{{a.t}}</div>
  </sc-for>
  <sc-if value="{{cta}}" hint-placeholder-val="{{ true }}"><button style="margin-top:auto;height:48px;border:0;border-radius:12px;background:#1D5C7A;color:#FFFFFF;font:600 15px 'Golos Text'">{{cta}}</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const T='#14202B';
return { h:'844px', title:'Открыть вклад', sub:'Учебный вклад · учебные деньги', cta:'Открыть вклад',
cards:[
{h:'Условия',l:[{k:'Сумма',v:'100 000 UKZT',c:T},{k:'Ставка',v:'14% годовых',c:T},{k:'Срок',v:'12 месяцев',c:T},{k:'Капитализация',v:'ежемесячно',c:T}]},
{h:'Рост со сложным процентом',pts:'0,65 33,62 66,59 99,55 132,51 165,47 198,42 231,37 264,31 297,24 330,17',l:[{k:'Через 1 год',v:'114 934 UKZT',c:T},{k:'Через 5 лет',v:'200 423 UKZT',c:T}],n:'Правило 72: удвоение за ~72 / 14 ≈ 5 лет.'}
],
alerts:[{c:'#2458B3',t:'ⓘ Вклад застрахован. Брокерский и металлический счета — нет.'}] };
}
}
</script>
</body>
</html>
