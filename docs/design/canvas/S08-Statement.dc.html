<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Выписка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F6F8;color:#14202B;font-family:'Golos Text',sans-serif;padding:20px 16px;display:flex;flex-direction:column;gap:12px">
  <div style="font-size:22px;font-weight:600">Выписка</div>
  <div style="display:flex;gap:8px;font-size:13px"><span style="padding:8px 12px;border-radius:999px;background:#EAEEF2">Неделя</span><span style="padding:8px 12px;border-radius:999px;background:#1D5C7A;color:#FFFFFF">Месяц</span><span style="padding:8px 12px;border-radius:999px;background:#EAEEF2">Год</span><span style="padding:8px 12px;border-radius:999px;background:#EAEEF2">Период…</span></div>
  <div style="background:#FFFFFF;border-radius:16px;padding:4px 14px">
    <sc-for list="{{ops}}" as="o" hint-placeholder-count="5">
      <div style="padding:10px 0;border-bottom:1px solid #D3DAE1">
        <div class="num" style="display:flex;justify-content:space-between;font-size:15px"><span>{{o.t}}</span><span>{{o.a}}</span></div>
        <div class="num" style="font-size:12px;color:#526170">{{o.d}}</div>
      </div>
    </sc-for>
  </div>
  <div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:15px;font-weight:600">Итоги 2026 года</div>
    <div class="num" style="display:flex;justify-content:space-between;font-size:14px"><span>Доход</span><span>↑ + 86 400 UKZT</span></div>
    <div class="num" style="display:flex;justify-content:space-between;font-size:14px"><span>Комиссии</span><span>− 4 120 UKZT</span></div>
    <div class="num" style="display:flex;justify-content:space-between;font-size:14px"><span>Спред уплачен</span><span>− 2 980 UKZT</span></div>
    <div class="num" style="display:flex;justify-content:space-between;font-size:14px;font-weight:600"><span>Налог на доход 10% (оценка)</span><span>≈ 7 930 UKZT</span></div>
    <div style="font-size:12px;color:#526170">Оценка учебная: считаем 10% от дохода за вычетом комиссий.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { ops:[
{t:'Обмен UKZT → UUSD',a:'− 50 000',d:'12.11 · комиссия 150 · спред 210'},
{t:'Покупка TKR × 10',a:'− 50 120',d:'11.11 · комиссия 120 · спред 20'},
{t:'Продажа ABC × 5',a:'+ 6 180',d:'09.11 · комиссия 60 · спред 15'},
{t:'Проценты по вкладу',a:'+ 1 150',d:'01.11 · без комиссии'},
{t:'Перевод на вклад',a:'− 100 000',d:'01.11 · без комиссии'}
]};
}
}
</script>
</body>
</html>
