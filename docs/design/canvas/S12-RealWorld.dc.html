<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Реальный мир</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F4F6F8;color:#14202B;font-family:'Golos Text',sans-serif;padding:20px 16px;display:flex;flex-direction:column;gap:12px">
  <div style="font-size:22px;font-weight:600">Реальный мир</div>
  <div style="font-size:13px;color:#526170">Настоящие курсы — только для наблюдения. Торговать ими здесь нельзя.</div>
  <div style="background:#FFFFFF;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:17px;font-weight:600">USD / KZT</span><span style="font-size:12px;padding:3px 8px;border-radius:999px;background:#EAEEF2;color:#526170">с задержкой</span></div>
    <div class="num" style="font-size:28px;font-weight:600">[КУРС]</div>
    <div style="font-size:12px;color:#526170">Источник: Нацбанк РК, курс на 12.11.2026</div>
    <svg viewBox="0 0 330 70" style="width:100%;height:70px" role="img" aria-label="График USD/KZT"><polyline points="0,40 33,42 66,38 99,35 132,37 165,30 198,32 231,28 264,30 297,25 330,27" fill="none" stroke="#526170" stroke-width="2"></polyline></svg>
  </div>
  <div style="background:#FFFFFF;border-radius:16px;padding:4px 14px">
    <sc-for list="{{pairs}}" as="r" hint-placeholder-count="3"><div class="num" style="display:flex;justify-content:space-between;min-height:48px;align-items:center;border-bottom:1px solid #D3DAE1;font-size:15px"><span>{{r}}</span><span style="color:#526170">[КУРС] · Нацбанк РК</span></div></sc-for>
  </div>
  <button style="margin-top:auto;height:48px;border:2px dashed #1D5C7A;border-radius:12px;background:#FFFFFF;color:#1D5C7A;font:600 15px 'Golos Text'">Открыть учебную позицию по этому курсу</button>
  <div style="font-size:12px;color:#526170;text-align:center">Учебная позиция использует учебные деньги и реальный курс как ориентир.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic { renderVals(){ return { pairs:['EUR / KZT','RUB / KZT','CNY / KZT'] }; } }
</script>
</body>
</html>
