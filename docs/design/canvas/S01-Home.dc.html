<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Главная / Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:1330px;height:844px;display:flex;gap:80px;font-family:'Golos Text',sans-serif">
<sc-for list="{{v}}" as="p" hint-placeholder-count="3">
<div style="width:390px;height:844px;box-sizing:border-box;background:{{p.bg}};color:{{p.tx}};display:flex;flex-direction:column">
  <div style="padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:22px;font-weight:600">{{p.s.hello}}</div>
    <button aria-label="{{p.s.notif}}" style="width:44px;height:44px;border-radius:12px;border:1px solid {{p.bd}};background:{{p.sf}};color:{{p.tx}}">◔</button>
  </div>
  <div style="margin:8px 16px;background:{{p.pr}};color:{{p.op}};border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:4px">
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>{{p.s.total}}</span><span style="background:#FFF4E5;color:#8F5A00;padding:2px 8px;border-radius:999px;font-weight:600;font-size:12px">{{p.s.badge}}</span></div>
    <div class="num" style="font-size:32px;font-weight:600">1 284 500 UKZT</div>
    <div class="num" style="font-size:13px">↑ +12 400 (+0,97%) {{p.s.month}}</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 16px">
    <sc-for list="{{p.s.qa}}" as="q" hint-placeholder-count="4"><button style="min-height:64px;border:0;border-radius:12px;background:{{p.sf}};color:{{p.tx}};font:500 12px 'Golos Text';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><span style="font-size:18px;color:{{p.pr}}">{{q.i}}</span>{{q.t}}</button></sc-for>
  </div>
  <div style="margin:8px 16px;background:{{p.sf}};border-radius:20px;padding:4px 16px">
    <sc-for list="{{p.s.acc}}" as="a" hint-placeholder-count="4">
      <div style="display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid {{p.bd}}"><span style="font-size:15px">{{a.n}}</span><span class="num" style="font-size:15px">{{a.b}}</span></div>
    </sc-for>
  </div>
  <div style="padding:8px 16px 4px;font-size:17px;font-weight:600">{{p.s.recent}}</div>
  <div style="margin:0 16px;background:{{p.sf}};border-radius:20px;padding:4px 16px;flex:1">
    <sc-for list="{{p.s.ops}}" as="o" hint-placeholder-count="3">
      <div style="display:flex;gap:12px;align-items:center;min-height:56px;border-bottom:1px solid {{p.bd}}">
        <div style="flex:1"><div style="font-size:15px">{{o.t}}</div><div style="font-size:12px;color:{{p.t2}}">{{o.f}}</div></div>
        <div class="num" style="font-size:15px">{{o.a}}</div>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;justify-content:space-around;padding:8px 0 20px;margin-top:8px;border-top:1px solid {{p.bd}};background:{{p.sf}};font-size:11px;color:{{p.t2}}">
    <sc-for list="{{p.s.tabs}}" as="t" hint-placeholder-count="5"><span style="min-width:60px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:16px">{{t.i}}</span>{{t.t}}</span></sc-for>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={bg:'#F4F6F8',sf:'#FFFFFF',tx:'#14202B',t2:'#526170',pr:'#1D5C7A',op:'#FFFFFF',bd:'#D3DAE1'};
const D={bg:'#0E151B',sf:'#16212A',tx:'#E8EEF3',t2:'#9AA9B6',pr:'#6FB3D6',op:'#06202E',bd:'#2C3B48'};
const tabs=(a)=>a.map((t,i)=>({t,i:['⌂','↗','⇄','▤','⋯'][i]}));
const RU={hello:'Добрый день, Айгерим',notif:'Уведомления',total:'Весь баланс',badge:'учебные деньги',month:'за месяц',recent:'Последние операции',
qa:[{i:'↗',t:'Перевести'},{i:'⇄',t:'Обменять'},{i:'▲',t:'Купить'},{i:'%',t:'Вклад'}],
acc:[{n:'Текущий счёт',b:'412 300 UKZT'},{n:'Валютный счёт',b:'820,40 UUSD'},{n:'Брокерский счёт',b:'356 900 UKZT'},{n:'Вклад 14%',b:'100 000 UKZT'}],
ops:[{t:'Обмен UKZT → UUSD',f:'Комиссия 150 · спред 210 UKZT',a:'− 50 000'},{t:'Покупка 10 акций',f:'Комиссия 120 UKZT',a:'− 50 120'},{t:'Проценты по вкладу',f:'Без комиссии',a:'+ 1 150'}],
tabs:tabs(['Главная','Платежи','Обмен','Инвестиции','Ещё'])};
const EN={hello:'Good afternoon, Aigerim',notif:'Notifications',total:'Total balance',badge:'practice money',month:'this month',recent:'Recent activity',
qa:[{i:'↗',t:'Transfer'},{i:'⇄',t:'Exchange'},{i:'▲',t:'Buy'},{i:'%',t:'Deposit'}],
acc:[{n:'Current account',b:'412 300 UKZT'},{n:'FX account',b:'820.40 UUSD'},{n:'Brokerage',b:'356 900 UKZT'},{n:'Deposit 14%',b:'100 000 UKZT'}],
ops:[{t:'Exchange UKZT → UUSD',f:'Fee 150 · spread 210 UKZT',a:'− 50 000'},{t:'Bought 10 shares',f:'Fee 120 UKZT',a:'− 50 120'},{t:'Deposit interest',f:'No fee',a:'+ 1 150'}],
tabs:tabs(['Home','Payments','Exchange','Invest','More'])};
return { v:[{...L,s:RU},{...D,s:RU},{...L,s:EN}] };
}
}
</script>
</body>
</html>
