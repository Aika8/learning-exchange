<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Заявка / Order ticket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}.num{font-family:Inter,sans-serif;font-variant-numeric:tabular-nums}</style>
</helmet>
<div style="width:1330px;height:844px;display:flex;gap:80px;font-family:'Golos Text',sans-serif">
<sc-for list="{{v}}" as="p" hint-placeholder-count="3">
<div style="width:390px;height:844px;box-sizing:border-box;background:{{p.dim}};display:flex;flex-direction:column;justify-content:flex-end">
<div style="background:{{p.sf}};color:{{p.tx}};border-radius:20px 20px 0 0;padding:12px 16px 20px;display:flex;flex-direction:column;gap:10px">
  <div style="width:36px;height:4px;border-radius:2px;background:{{p.bd}};margin:0 auto"></div>
  <div style="font-size:17px;font-weight:600">{{p.s.title}}</div>
  <div style="display:flex;background:{{p.alt}};border-radius:12px;padding:4px"><button style="flex:1;height:40px;border:0;border-radius:8px;background:{{p.sf}};color:{{p.tx}};font:600 14px 'Golos Text'">{{p.s.limit}}</button><button style="flex:1;height:40px;border:0;background:transparent;color:{{p.t2}};font:500 14px 'Golos Text'">{{p.s.market}}</button></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
    <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:{{p.t2}}">{{p.s.price}}<input class="num" value="5 010,0" style="height:44px;border:1px solid {{p.bd}};border-radius:12px;padding:0 10px;font-size:16px;background:{{p.sf}};color:{{p.tx}}"></label>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:{{p.t2}}">{{p.s.qty}}<input class="num" value="40" style="height:44px;border:1px solid {{p.bd}};border-radius:12px;padding:0 10px;font-size:16px;background:{{p.sf}};color:{{p.tx}}"></label>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:{{p.t2}}">{{p.s.stop}}<input class="num" value="4 760,0" style="height:44px;border:2px solid {{p.pr}};border-radius:12px;padding:0 10px;font-size:16px;background:{{p.sf}};color:{{p.tx}}"></label>
    <label style="display:flex;flex-direction:column;gap:4px;font-size:12px;color:{{p.t2}}">{{p.s.tp}}<input class="num" value="5 510,0" style="height:44px;border:1px solid {{p.bd}};border-radius:12px;padding:0 10px;font-size:16px;background:{{p.sf}};color:{{p.tx}}"></label>
  </div>
  <div style="font-size:12px;color:{{p.t2}}">{{p.s.tpMode}}</div>
  <div class="num" style="background:{{p.alt}};border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px">
    <div style="font-weight:600">{{p.s.risk}}</div>
    <div style="display:flex;justify-content:space-between"><span>{{p.s.sugg}}</span><span>40</span></div>
    <div style="display:flex;justify-content:space-between"><span>R:R</span><span>1 : 2,0</span></div>
    <div style="display:flex;justify-content:space-between"><span>{{p.s.fee}}</span><span>≈ 200 UKZT</span></div>
  </div>
  <div style="border:1px solid {{p.wn}};color:{{p.wn}};border-radius:12px;padding:8px 12px;font-size:13px">⚠ {{p.s.warn}}</div>
  <button style="height:48px;border:0;border-radius:12px;background:{{p.pr}};color:{{p.op}};font:600 15px 'Golos Text'">{{p.s.cta}}</button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1330,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const L={dim:'#8C969F',sf:'#FFFFFF',alt:'#EAEEF2',tx:'#14202B',t2:'#526170',pr:'#1D5C7A',op:'#FFFFFF',bd:'#D3DAE1',wn:'#8F5A00'};
const D={dim:'#05090C',sf:'#16212A',alt:'#1F2C37',tx:'#E8EEF3',t2:'#9AA9B6',pr:'#6FB3D6',op:'#06202E',bd:'#2C3B48',wn:'#E3B356'};
const RU={title:'Покупка TKR',limit:'Лимитная',market:'Рыночная',price:'Цена',qty:'Количество',stop:'Стоп-лосс · обязательно',tp:'Тейк-профит',tpMode:'Тейк-профит: фиксированный · трейлинг',risk:'Риск на сделку: 1% капитала = 10 000 UKZT',sugg:'Кол-во по стопу',fee:'Комиссия',warn:'Если риск больше 2% капитала, мы покажем предупреждение.',cta:'Проверить и подтвердить'};
const EN={title:'Buy TKR',limit:'Limit',market:'Market',price:'Price',qty:'Quantity',stop:'Stop-loss · required',tp:'Take-profit',tpMode:'Take-profit: fixed · trailing',risk:'Risk per trade: 1% of capital = 10 000 UKZT',sugg:'Qty from stop',fee:'Fee',warn:'If risk exceeds 2% of capital, we will warn you.',cta:'Review and confirm'};
return { v:[{...L,s:RU},{...D,s:RU},{...L,s:EN}] };
}
}
</script>
</body>
</html>
