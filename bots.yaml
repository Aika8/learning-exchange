# Bots that keep the markets alive (ADR-0007). Read by the backend at start (`make dev`).
# Every bot is an ordinary account: it logs in, gets its capital as a journalled deposit the first time,
# and trades through the same port as a person, paying the same fees.
# Prices are SPARK minor units (2 decimals): 10000 = 100.00 SPARK. Quantities are whole SILK / AMBER.
seed: 42              # same seed + same clock → same market
tickMillis: 500       # real time between bot steps at speed 1 (speed N → N steps per tick)
markets:
  - instrument: SILK-SPARK          # a stock
    fairValue:
      start: 10000        # 100.00 SPARK
      volatilityBps: 4    # random-walk step, basis points of the price
      floor: 100
    bots:
      - name: bot-market-maker
        strategy: market-maker
        capital: { SPARK: 100000000, SILK: 10000 }   # 1 000 000.00 SPARK, 10 000 SILK
        params:
          halfSpread: 10    # 0.10 SPARK from fair value to the best quote
          step: 5           # 0.05 between its levels
          levels: 6
          qty: 12
          targetBase: 10000
          skewPerUnit: 0.02 # price shift (minor units) per SILK away from target
      - name: bot-noise
        strategy: noise
        count: 4
        capital: { SPARK: 5000000, SILK: 500 }       # 50 000.00 SPARK, 500 SILK
        params:
          activity: 0.6     # chance to trade in a step
          maxQty: 6
          marketShare: 0.5  # half market orders, half limit orders near the last price
      - name: bot-silk-momentum
        strategy: momentum
        capital: { SPARK: 10000000, SILK: 50 }
        params: { thresholdBps: 60, qty: 3, activity: 0.3 }
      - name: bot-silk-fundamentalist
        strategy: fundamentalist
        capital: { SPARK: 20000000, SILK: 100 }
        params: { targetPe: 10, marginBps: 800, qty: 5, activity: 0.2 }
      - name: bot-silk-index
        strategy: index-investor
        capital: { SPARK: 20000000 }
        params: { everySteps: 120, qty: 1 }
  - instrument: AMBER-SPARK         # FX: a foreign currency, like USD/KZT; leverage ×4 allowed
    fairValue:
      start: 50000        # 500.00 SPARK per AMBER
      volatilityBps: 3
      floor: 100
    bots:
      - name: bot-fx-dealer
        strategy: market-maker
        capital: { SPARK: 2000000000, AMBER: 200000 } # 20 000 000.00 SPARK, 200 000 AMBER
        params:
          halfSpread: 30    # buy/sell rates 0.30 SPARK either side of fair value: the spread a bank earns
          step: 10
          levels: 6
          qty: 400
          targetBase: 200000
          skewPerUnit: 0.0005
      - name: bot-fx-noise
        strategy: noise
        count: 3
        capital: { SPARK: 50000000, AMBER: 1000 }    # 500 000.00 SPARK, 1 000 AMBER
        params:
          activity: 0.5
          maxQty: 40
          marketShare: 0.5
  # ---- M2b ----
  - instrument: FORGE-SPARK         # a second company; reports move it by the surprise (ADR-0007)
    fairValue:
      start: 25000        # 250.00 SPARK ≈ P/E 12.5 on ~20 SPARK yearly EPS
      volatilityBps: 4
      floor: 100
    bots:
      - name: bot-forge-maker
        strategy: market-maker
        capital: { SPARK: 200000000, FORGE: 10000 }
        params: { halfSpread: 20, step: 10, levels: 6, qty: 8, targetBase: 10000, skewPerUnit: 0.04 }
      - name: bot-forge-noise
        strategy: noise
        count: 2
        capital: { SPARK: 5000000, FORGE: 200 }
        params: { activity: 0.5, maxQty: 4, marketShare: 0.5 }
      - name: bot-forge-momentum
        strategy: momentum
        capital: { SPARK: 10000000, FORGE: 50 }
        params: { thresholdBps: 60, qty: 3, activity: 0.3 }
      - name: bot-forge-meanrev
        strategy: mean-reversion
        capital: { SPARK: 10000000, FORGE: 50 }
        params: { bandBps: 50, qty: 3, activity: 0.3 }
      - name: bot-forge-fundamentalist
        strategy: fundamentalist
        capital: { SPARK: 20000000, FORGE: 100 }
        params: { targetPe: 12, marginBps: 800, qty: 5, activity: 0.2 }
      - name: bot-forge-index
        strategy: index-investor
        capital: { SPARK: 20000000 }
        params: { everySteps: 120, qty: 1 }
  - instrument: HBND-SPARK          # government bond, AAA: price follows the policy rate through duration
    fairValue:
      start: 98000
      volatilityBps: 1
      floor: 100
    bots:
      - name: bot-hbnd-dealer
        strategy: market-maker
        capital: { SPARK: 500000000, HBND: 2000 }
        params: { halfSpread: 50, step: 20, levels: 5, qty: 10, targetBase: 2000, skewPerUnit: 0.5 }
      - name: bot-hbnd-noise
        strategy: noise
        count: 2
        capital: { SPARK: 20000000, HBND: 50 }
        params: { activity: 0.3, maxQty: 3, marketShare: 0.5 }
  - instrument: GBND-SPARK          # high-yield bond, CCC: its issuer can pay ~3 coupons, then defaults
    fairValue:
      start: 90000
      volatilityBps: 3
      floor: 100
    bots:
      - name: bot-gbnd-dealer
        strategy: market-maker
        capital: { SPARK: 300000000, GBND: 1500 }
        params: { halfSpread: 150, step: 50, levels: 5, qty: 10, targetBase: 1500, skewPerUnit: 0.5 }
      - name: bot-gbnd-noise
        strategy: noise
        count: 3
        capital: { SPARK: 20000000, GBND: 50 }
        params: { activity: 0.3, maxQty: 3, marketShare: 0.5 }
  # ---- M2c: funds (ADR-0022). A unit's fair value is anchored to the fund's NAV per unit; the dealer quotes it. ----
  - instrument: IDX-SPARK           # index fund: both companies by capitalisation, TER 0.20%
    fairValue:
      start: 3675         # ≈ NAV per unit at the start: (2000 SILK × 100 + 2000 FORGE × 250 + 35 000 cash) / 20 000 units
      volatilityBps: 1
      floor: 10
    bots:
      - name: bot-idx-dealer
        strategy: market-maker
        capital: { SPARK: 50000000, IDX: 18000 }
        params: { halfSpread: 3, step: 2, levels: 5, qty: 40, targetBase: 18000, skewPerUnit: 0.001 }
      - name: bot-idx-noise
        strategy: noise
        count: 2
        capital: { SPARK: 2000000, IDX: 1000 }
        params: { activity: 0.3, maxQty: 30, marketShare: 0.5 }
      - name: bot-idx-index
        strategy: index-investor
        capital: { SPARK: 5000000 }
        params: { everySteps: 60, qty: 10 }
  - instrument: ACT-SPARK           # active fund: the manager's picks (FORGE-heavy), TER 2%
    fairValue:
      start: 2450         # (600 SILK × 100 + 1600 FORGE × 250 + 30 000 cash) / 20 000 units
      volatilityBps: 1
      floor: 10
    bots:
      - name: bot-act-dealer
        strategy: market-maker
        capital: { SPARK: 50000000, ACT: 18000 }
        params: { halfSpread: 3, step: 2, levels: 5, qty: 40, targetBase: 18000, skewPerUnit: 0.001 }
      - name: bot-act-noise
        strategy: noise
        count: 2
        capital: { SPARK: 2000000, ACT: 1000 }
        params: { activity: 0.3, maxQty: 30, marketShare: 0.5 }
