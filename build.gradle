subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // No test run may hang forever and burn a core (a test worker once ran for 23 h): the whole task is cut
        // after 15 minutes, and every JUnit Jupiter test after 2 minutes unless it declares its own @Timeout.
        timeout = java.time.Duration.ofMinutes(15)
        systemProperty 'junit.jupiter.execution.timeout.default', '2 m'
    }
}
